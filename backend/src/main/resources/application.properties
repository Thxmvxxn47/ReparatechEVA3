spring.application.name=ReparaTech
server.port=8080
spring.datasource.url=jdbc:h2:file:./datos/reparatech;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
springdoc.swagger-ui.path=/swagger-ui.html
app.jwt.secret=${JWT_SECRET:ReparaTechDesarrolloLocalSoloCambiarEnProduccionClaveSeguraDe64Caracteres123456789}
app.jwt.minutes=15
app.cors.origin=${FRONTEND_ORIGIN:http://localhost:5173}
